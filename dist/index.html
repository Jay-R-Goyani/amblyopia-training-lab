<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amblyopia Training Lab</title>
<meta name="description" content="Local, research-based training for adults with amblyopia: contrast, crowding and two-eye games with red/cyan glasses.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:ital,wght@0,400..800;1,400..800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* Amblyopia Training Lab · design system "Clinical calm"
   One brand colour (petrol teal) on cool white and slate. Deep shades, because light blues look faded to older eyes.
   Text meets WCAG AAA (7:1) in light and dark; controls and borders meet AA non-text (3:1).
   The UI never uses pure red, blue or cyan, so it can't be mistaken for a lens colour in the training.
   Type: Atkinson Hyperlegible Next (Braille Institute, for low-vision readers). Sizes in rem so the text-size setting scales everything.
   Game settings pages always use the dark palette, so the eyes don't jump from a bright page to the black play screen. */

/* Eye colours: defaults only. applyEyeColors() sets the real lens colours on <html>. */
:root { --eyeL: #e5484d; --eyeR: #12a5b5; }
:root, body[data-ui="light"] {
  --bg: #f4f6f8;
  --surface: #ffffff;
  --surface-2: #edf1f4;
  --surface-3: #e1e7ec;
  --line: #d3dbe1;
  --line-strong: #7b8c98;
  --text: #14212b;
  --muted: #3f5265;
  --primary: #0b5a6b;
  --primary-hover: #084857;
  --primary-ink: #ffffff;
  --primary-soft: #e1eef1;
  --primary-text: #0a5464;
  --sun: #c27a12;
  --sun-soft: #fcf1dd;
  --sun-ink: #7a4708;
  --good: #1c6840; --good-soft: #e3f1e8;
  --warn: #7f4600; --warn-soft: #fbefd9;
  --crit: #a3241c; --crit-soft: #fbe8e6;
  --focus: #1e4fd0;
  --shadow: 0 1px 2px rgba(16, 32, 44, 0.05), 0 2px 10px rgba(16, 32, 44, 0.04);
  --shadow-lg: 0 18px 50px rgba(8, 20, 28, 0.35);
  --border-w: 1px;
  --font: "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  --r: 14px; --r-sm: 10px; --r-btn: 10px;
  color-scheme: light;
}
body[data-ui="dark"] {
  --bg: #0d1419;
  --surface: #141d24;
  --surface-2: #1a252d;
  --surface-3: #223039;
  --line: #2a3842;
  --line-strong: #6a7e8b;
  --text: #e6edf1;
  --muted: #a6b5bf;
  --primary: #63c3cf;
  --primary-hover: #86d2dc;
  --primary-ink: #04181d;
  --primary-soft: #12323b;
  --primary-text: #7ccfda;
  --sun: #f0b45a; --sun-soft: #33290f; --sun-ink: #f0c277;
  --good: #6fcb98; --good-soft: #12301f;
  --warn: #e9bc5c; --warn-soft: #33290f;
  --crit: #ff8f86; --crit-soft: #3a1c1a;
  --focus: #9cc0ff;
  --shadow: none;
  color-scheme: dark;
}
body[data-ui="contrast"] {
  --bg: #000000;
  --surface: #000000;
  --surface-2: #101010;
  --surface-3: #1c1c1c;
  --line: #ffffff;
  --line-strong: #ffffff;
  --text: #ffffff;
  --muted: #f2f2f2;
  --primary: #ffd400;
  --primary-hover: #ffe24d;
  --primary-ink: #000000;
  --primary-soft: #2e2600;
  --primary-text: #ffd400;
  --sun: #ffd400; --sun-soft: #1c1c1c; --sun-ink: #ffd400;
  --good: #7dffa3; --good-soft: #002a12;
  --warn: #ffd400; --warn-soft: #1c1700;
  --crit: #ff8f8f; --crit-soft: #2a0000;
  --focus: #00e5ff;
  --shadow: none;
  --border-w: 2px;
  color-scheme: dark;
}

/* ---------- base ---------- */
* { box-sizing: border-box; }
html, body { height: 100%; }
html { font-size: 18px; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 1rem; line-height: 1.55; -webkit-font-smoothing: antialiased; font-optical-sizing: auto; }
body.stage-open { overflow: hidden; }
a { color: var(--primary-text); text-underline-offset: 3px; text-decoration-thickness: 1px; }
a:hover { text-decoration-thickness: 2px; }
h1, h2, h3 { text-wrap: balance; margin: 0; font-weight: 700; line-height: 1.2; letter-spacing: -0.01em; }
h1 { font-size: clamp(1.65rem, 2.6vw, 2.05rem); letter-spacing: -0.02em; }
h2 { font-size: 1.2rem; }
h3 { font-size: 1.05rem; }
p { margin: 0; }
ul, ol { margin: 0; }
b, strong { font-weight: 700; }
kbd { font-family: var(--font); font-size: 0.85em; padding: 0.05rem 0.4rem; border: var(--border-w) solid var(--line-strong); border-bottom-width: 2px; border-radius: 6px; background: var(--surface-2); color: var(--text); }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 8px; }
.ic { width: 1.3em; height: 1.3em; flex: none; }
.muted { color: var(--muted); }
.small { font-size: 0.9rem; }
.tiny { font-size: 0.84rem; color: var(--muted); line-height: 1.45; }
.num { font-variant-numeric: tabular-nums; }
.tgood { color: var(--good); } .tcrit { color: var(--crit); } .twarn { color: var(--warn); }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); border: 0; }
.skip { position: absolute; left: 1rem; top: -4rem; z-index: 200; background: var(--primary); color: var(--primary-ink); padding: 0.6rem 1rem; border-radius: var(--r-sm); font-weight: 600; }
.skip:focus { top: 1rem; }

/* ---------- shell ---------- */
.app { display: grid; grid-template-columns: 16.5rem 1fr; min-height: 100%; }
.rail { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 1.5rem; padding: 1.3rem 0.9rem 1.1rem; background: var(--surface); border-right: var(--border-w) solid var(--line); overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 0.7rem; text-decoration: none; color: var(--text); padding: 0.1rem 0.5rem; }
.brand .bname { display: flex; flex-direction: column; line-height: 1.15; }
.brand .bname b { font-size: 1rem; letter-spacing: -0.01em; }
.brand .bname span { font-size: 0.8rem; color: var(--muted); margin-top: 0.15rem; }
.glyph { width: 2.9rem; height: 1.65rem; flex: none; }
.navlab { font-size: 0.78rem; font-weight: 600; color: var(--muted); padding: 0 0.85rem; margin-bottom: -0.9rem; }
.rail nav { display: flex; flex-direction: column; gap: 0.15rem; }
.rail nav a { position: relative; display: flex; align-items: center; gap: 0.8rem; text-decoration: none; padding: 0 0.85rem; min-height: 2.85rem; border-radius: var(--r-sm); color: var(--muted); font-size: 0.98rem; font-weight: 600; }
.rail nav a .ic { width: 1.25rem; height: 1.25rem; }
.rail nav a:hover { color: var(--text); background: var(--surface-2); }
.rail nav a.on { color: var(--primary-text); background: var(--primary-soft); }
.rail nav a.on::before { content: ""; position: absolute; left: -0.9rem; top: 0.55rem; bottom: 0.55rem; width: 3px; border-radius: 0 3px 3px 0; background: var(--primary); }
.rail-foot { margin-top: auto; display: flex; flex-direction: column; gap: 0.8rem; }
.patient { display: flex; flex-direction: column; gap: 0.45rem; padding: 0.85rem 0.9rem; border: var(--border-w) solid var(--line); border-radius: var(--r-sm); text-decoration: none; color: var(--text); }
.patient:hover { background: var(--surface-2); }
.patient .who { display: flex; align-items: center; gap: 0.6rem; }
.patient .av { width: 2rem; height: 2rem; border-radius: 50%; display: grid; place-items: center; background: var(--primary-soft); color: var(--primary-text); font-weight: 700; font-size: 0.85rem; flex: none; }
.patient .who b { font-size: 0.92rem; line-height: 1.2; display: block; }
.patient .who > span:last-child { min-width: 0; }
.patient .who > span:last-child > span { font-size: 0.78rem; color: var(--muted); display: block; }
.display-mini { display: flex; flex-direction: column; gap: 0.45rem; padding: 0.2rem 0.3rem 0; }
.display-mini .lab { font-size: 0.78rem; color: var(--muted); font-weight: 600; }
.chipset { display: flex; flex-wrap: wrap; gap: 0.3rem; }
.chipbtn { font: inherit; font-size: 0.82rem; font-weight: 600; min-height: 2.4rem; min-width: 2.4rem; padding: 0 0.65rem; border-radius: 8px; border: var(--border-w) solid var(--line-strong); background: var(--surface); color: var(--text); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 0.35rem; }
.chipbtn:hover { background: var(--surface-2); }
.chipbtn[aria-pressed="true"] { background: var(--primary); color: var(--primary-ink); border-color: var(--primary); }
.eyechips { display: flex; flex-direction: column; gap: 0.25rem; }
.eyechip { display: flex; align-items: center; gap: 0.5rem; font-size: 0.8rem; color: var(--muted); }
.eyechip .d, .dotc { width: 0.65rem; height: 0.65rem; border-radius: 50%; border: 1px solid rgba(0,0,0,0.25); flex: none; display: inline-block; }
.privacy { display: flex; gap: 0.4rem; align-items: center; font-size: 0.78rem; color: var(--muted); padding: 0 0.3rem; }
.privacy .ic { width: 0.95rem; height: 0.95rem; }
.main { padding: 2rem clamp(1rem, 4vw, 3rem) 4rem; display: flex; flex-direction: column; gap: 1.4rem; max-width: 76rem; width: 100%; outline: none; }
.view-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 0.8rem 1.5rem; padding-bottom: 0.2rem; }
.view-head > .vh { display: flex; flex-direction: column; gap: 0.35rem; min-width: 0; flex: 1 1 26rem; }
.head-actions { display: flex; flex-wrap: wrap; gap: 0.6rem; align-items: center; }
.eyebrow { font-size: 0.88rem; color: var(--muted); font-weight: 600; }
.sub { color: var(--muted); max-width: 64ch; font-size: 1rem; }

/* ---------- cards & tiles ---------- */
.card { background: var(--surface); border: var(--border-w) solid var(--line); border-radius: var(--r); padding: 1.3rem 1.4rem; display: flex; flex-direction: column; gap: 0.95rem; box-shadow: var(--shadow); }
.card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 0.4rem 0.8rem; flex-wrap: wrap; }
.card-head .muted { font-size: 0.9rem; }
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1rem; }
.tile { background: var(--surface); border: var(--border-w) solid var(--line); border-radius: var(--r); padding: 1.05rem 1.15rem; display: flex; gap: 0.85rem; align-items: flex-start; box-shadow: var(--shadow); min-width: 0; }
.tile .tic { width: 2.4rem; height: 2.4rem; border-radius: var(--r-sm); display: grid; place-items: center; background: var(--primary-soft); color: var(--primary-text); flex: none; }
.tile .tic .ic { width: 1.25rem; height: 1.25rem; }
.tile .tic.sun { background: var(--sun-soft); color: var(--sun-ink); }
.tile .tbody { display: flex; flex-direction: column; min-width: 0; gap: 0.1rem; }
.tile .lab { font-size: 0.86rem; color: var(--muted); font-weight: 600; }
.tile .big { font-size: 1.6rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.2; letter-spacing: -0.01em; }
.tile .big small { font-size: 0.9rem; color: var(--muted); font-weight: 400; letter-spacing: 0; }
.tile .hint { font-size: 0.86rem; color: var(--muted); }
.tiles.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.tiles.four { grid-template-columns: repeat(4, minmax(0, 1fr)); }
body.wizard-mode .app { grid-template-columns: 1fr; }
body.wizard-mode .rail { display: none; }
body.wizard-mode .main { margin: 0 auto; max-width: 52rem; align-items: stretch; }
body.wizard-mode .wizard { margin: 0 auto; }

/* ---------- hero (today) ---------- */
.hero { display: grid; grid-template-columns: auto 1fr; gap: 1.8rem; align-items: center; background: var(--surface); border: var(--border-w) solid var(--line); border-radius: var(--r); padding: 1.6rem 1.8rem; box-shadow: var(--shadow); position: relative; overflow: hidden; }
.hero::after { content: ""; position: absolute; inset: 0 0 auto 0; height: 4px; background: var(--primary); }
.ring { width: 8.4rem; height: 8.4rem; position: relative; flex: none; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .track { stroke: var(--surface-3); }
.ring .fill { stroke: var(--primary); transition: stroke-dashoffset .6s ease; }
.ring .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.ring .center b { font-size: 1.85rem; line-height: 1; font-variant-numeric: tabular-nums; }
.ring .center span { font-size: 0.8rem; color: var(--muted); margin-top: 0.2rem; }
.hero-body { display: flex; flex-direction: column; gap: 0.65rem; min-width: 0; }
.hero-body h2 { font-size: 1.45rem; }
.hero h1 { font-size: clamp(1.5rem, 2.4vw, 1.9rem); }
.hero-actions { display: flex; flex-wrap: wrap; gap: 0.7rem; align-items: center; margin-top: 0.35rem; }
.needs { display: flex; flex-wrap: wrap; align-items: center; gap: 0.4rem 0.6rem; font-size: 0.9rem; color: var(--muted); }
.needs .wear { background: var(--surface-2); color: var(--text); padding: 0.2rem 0.6rem; border-radius: 8px; }
.donebadge { display: inline-flex; align-items: center; gap: 0.45rem; color: var(--good); font-weight: 700; }

/* ---------- plan ---------- */
.plan { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 0.5rem; }
.plan li { display: grid; grid-template-columns: 2.6rem 1fr auto auto; align-items: center; gap: 0.9rem; padding: 0.7rem 0.85rem; border-radius: var(--r-sm); border: var(--border-w) solid var(--line); background: var(--surface); }
.plan li.next { border-color: var(--primary); background: var(--primary-soft); box-shadow: inset 3px 0 0 var(--primary); }
.plan li.done { background: var(--surface-2); }
.plan li.done .pmain b { color: var(--muted); }
.gicon { width: 2.6rem; height: 2.6rem; border-radius: var(--r-sm); display: grid; place-items: center; background: var(--primary-soft); color: var(--primary-text); flex: none; }
.gicon .ic { width: 1.4rem; height: 1.4rem; }
.plan li.next .gicon { background: var(--surface); }
.plan li.done .gicon { background: var(--good-soft); color: var(--good); }
.pmain { display: flex; flex-direction: column; min-width: 0; gap: 0.1rem; }
.pmain b { font-size: 1rem; }
.pmain .meta { display: flex; flex-wrap: wrap; gap: 0.25rem 0.9rem; font-size: 0.86rem; color: var(--muted); align-items: center; }
.wear { display: inline-flex; align-items: center; gap: 0.35rem; }
.wear .ic { width: 1.1rem; height: 1.1rem; }
.lensdots { display: inline-flex; }
.lensdots i { width: 0.7rem; height: 0.7rem; border-radius: 50%; display: inline-block; border: 1px solid rgba(0,0,0,0.2); }
.lensdots i + i { margin-left: -0.2rem; }
.state-pill { font-size: 0.8rem; font-weight: 600; padding: 0.2rem 0.6rem; border-radius: 6px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.state-pill.done { background: var(--good-soft); color: var(--good); }
.state-pill.next { background: var(--primary); color: var(--primary-ink); }

/* ---------- game cards ---------- */
.sect-head { display: flex; gap: 0.9rem; align-items: flex-start; margin: 0.3rem 0 0.9rem; }
.sect-head .gicon { flex: none; }
.sect-head > div { display: flex; flex-direction: column; gap: 0.2rem; }
.ggrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(17rem, 1fr)); gap: 1rem; }
.gcard { background: var(--surface); border: var(--border-w) solid var(--line); border-radius: var(--r); padding: 1.15rem 1.15rem 1.05rem; display: flex; flex-direction: column; gap: 0.65rem; box-shadow: var(--shadow); transition: border-color .15s; }
.gcard:hover { border-color: var(--line-strong); }
.gcard.locked { opacity: 0.6; }
.gtop { display: flex; align-items: center; gap: 0.8rem; }
.gtop .gname { display: flex; flex-direction: column; min-width: 0; }
.gtop .gname span { font-size: 0.84rem; color: var(--muted); line-height: 1.35; }
.gtop .gname h3 { font-size: 1.06rem; }
.gfoot .pmain { gap: 0.2rem; }
.gcard p { color: var(--text); font-size: 0.95rem; }
.gcard details { font-size: 0.88rem; color: var(--muted); }
.gcard summary { cursor: pointer; color: var(--primary-text); font-weight: 600; width: fit-content; }
.gfoot { margin-top: auto; display: flex; justify-content: space-between; align-items: flex-end; gap: 0.6rem; flex-wrap: wrap; padding-top: 0.75rem; border-top: var(--border-w) solid var(--line); font-size: 0.85rem; color: var(--muted); }

/* ---------- buttons & fields ---------- */
.btn { appearance: none; font: inherit; font-weight: 600; font-size: 1rem; color: var(--text); background: var(--surface); border: var(--border-w) solid var(--line-strong); border-radius: var(--r-btn); min-height: 2.75rem; padding: 0 1.15rem; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; line-height: 1.2; transition: background .12s, border-color .12s; }
.btn:hover { background: var(--surface-2); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn .ic { width: 1.2rem; height: 1.2rem; }
.btn.primary { background: var(--primary); color: var(--primary-ink); border-color: var(--primary); }
.btn.primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); }
.btn.big { min-height: 3.2rem; padding: 0 1.6rem; font-size: 1.08rem; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--primary-text); }
.btn.ghost:hover { background: var(--surface-2); }
.btn.sm { min-height: 2.5rem; font-size: 0.92rem; padding: 0 0.95rem; }
.btn.danger { color: var(--crit); border-color: var(--crit); }
.btn.danger:hover { background: var(--crit-soft); }
.btn.letter { min-width: 3rem; font-size: 1.25rem; font-family: Arial, "Helvetica Neue", sans-serif; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem; }
.row.end { justify-content: flex-end; }
.row.between { justify-content: space-between; }
.row.tight { gap: 0.5rem; }
.col { display: flex; flex-direction: column; gap: 0.8rem; min-width: 14rem; }
.field { display: flex; flex-direction: column; gap: 0.4rem; font-size: 0.95rem; color: var(--text); font-weight: 600; border: 0; padding: 0; margin: 0; }
.field.inline { flex-direction: row; align-items: center; gap: 0.7rem; }
.field legend { padding: 0; margin-bottom: 0.45rem; }
.field .help { font-weight: 400; color: var(--muted); font-size: 0.86rem; }
.fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr)); gap: 1rem 1.2rem; }
select, input[type=number], input[type=text], input[type=date] { font: inherit; font-weight: 400; color: var(--text); background: var(--surface); border: var(--border-w) solid var(--line-strong); border-radius: var(--r-sm); min-height: 2.75rem; padding: 0 0.8rem; }
input[type=number] { width: 6rem; }
input[type=text] { width: 10rem; }
.fields input[type=text], .fields input[type=date] { width: 100%; }
select:hover, input[type=number]:hover, input[type=text]:hover, input[type=date]:hover { border-color: var(--text); }
input[type=range] { accent-color: var(--primary); min-width: 12rem; height: 2rem; }
.withunit { display: inline-flex; align-items: center; gap: 0.4rem; color: var(--text); font-weight: 400; }
.seg { display: inline-flex; flex-wrap: wrap; border: var(--border-w) solid var(--line-strong); border-radius: var(--r-sm); overflow: hidden; align-self: flex-start; background: var(--surface); }
.seg label { position: relative; }
.seg label + label span { border-left: var(--border-w) solid var(--line); }
.seg input { position: absolute; opacity: 0; }
.seg span { display: flex; align-items: center; min-height: 2.6rem; padding: 0 1.05rem; cursor: pointer; color: var(--text); font-weight: 600; font-size: 0.94rem; }
.seg span:hover { background: var(--surface-2); }
.seg input:checked + span { background: var(--primary); color: var(--primary-ink); }
.seg input:focus-visible + span { outline: 3px solid var(--focus); outline-offset: -3px; }
.check { display: flex; align-items: center; gap: 0.7rem; cursor: pointer; font-weight: 600; color: var(--text); }
.check input { width: 1.4rem; height: 1.4rem; accent-color: var(--primary); flex: none; }
.file input, .file-btn input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.file { display: inline-flex; position: relative; } .file span { border: 2px dashed var(--line-strong); border-radius: var(--r-sm); padding: 0.8rem 1.2rem; cursor: pointer; font-weight: 600; color: var(--text); }
.file-btn { position: relative; }
details > summary { cursor: pointer; }

/* ---------- notices ---------- */
.alert { display: flex; flex-wrap: wrap; align-items: center; gap: 0.8rem 1rem; padding: 0.95rem 1.1rem; border-radius: var(--r-sm); border: var(--border-w) solid var(--line); border-left-width: 4px; background: var(--surface); }
.alert > .ic { width: 1.5rem; height: 1.5rem; }
.alert > div { flex: 1 1 18rem; }
.alert.info { background: var(--primary-soft); border-color: var(--primary-soft); border-left-color: var(--primary); } .alert.info > .ic { color: var(--primary-text); }
.alert.warn { background: var(--warn-soft); border-color: var(--warn-soft); border-left-color: var(--warn); } .alert.warn > .ic { color: var(--warn); }
.alert.crit { background: var(--crit-soft); border-color: var(--crit-soft); border-left-color: var(--crit); } .alert.crit > .ic { color: var(--crit); }
.alert.good { background: var(--good-soft); border-color: var(--good-soft); border-left-color: var(--good); } .alert.good > .ic { color: var(--good); }
body[data-ui="contrast"] .alert { border-color: var(--line); }

/* ---------- insights ---------- */
.insights { display: grid; grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr)); gap: 1rem; }
.insight { background: var(--surface); border: var(--border-w) solid var(--line); border-radius: var(--r); padding: 1.05rem 1.15rem; display: flex; flex-direction: column; gap: 0.35rem; box-shadow: var(--shadow); }
.insight .lab { font-size: 0.86rem; color: var(--muted); font-weight: 600; }
.insight .big { font-size: 1.5rem; font-weight: 700; display: flex; align-items: center; gap: 0.4rem; font-variant-numeric: tabular-nums; }
.insight .big .ic { color: var(--good); }
.insight p { font-size: 0.9rem; color: var(--muted); }

/* ---------- settings / wizard ---------- */
.setup .step { display: flex; align-items: center; gap: 0.8rem; }
.setup [data-sec] { display: flex; flex-direction: column; gap: 0.95rem; }
.setup [data-sec] > .row + .muted, .setup [data-sec] > .cardcal + .row { margin-top: -0.2rem; }
.setup .num { width: 2.3rem; height: 2.3rem; border-radius: var(--r-sm); display: grid; place-items: center; background: var(--primary-soft); color: var(--primary-text); font-weight: 700; flex: none; }
.setup .num .ic { width: 1.2rem; height: 1.2rem; }
.setup .state { margin-left: auto; font-size: 0.8rem; font-weight: 600; padding: 0.2rem 0.65rem; border-radius: 6px; background: var(--surface-2); color: var(--muted); }
.setup .state.ok { background: var(--good-soft); color: var(--good); }
.setup .state.todo { background: var(--warn-soft); color: var(--warn); }
.settings-layout { display: grid; grid-template-columns: 13rem minmax(0, 1fr); gap: 1.6rem; align-items: start; }
.toc { position: sticky; top: 1.5rem; display: flex; flex-direction: column; gap: 0.1rem; }
.toc a { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; padding: 0.45rem 0.7rem; border-radius: 8px; text-decoration: none; color: var(--muted); font-weight: 600; font-size: 0.92rem; }
.toc a:hover { background: var(--surface-2); color: var(--text); }
.toc a i { width: 0.5rem; height: 0.5rem; border-radius: 50%; background: var(--warn); flex: none; }
.settings-list { display: flex; flex-direction: column; gap: 1.1rem; min-width: 0; }
.settings-list .card { scroll-margin-top: 1.2rem; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: 1.2rem; align-items: start; }
.grid2.even { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.notice { background: var(--surface-2); border-radius: var(--r-sm); padding: 1rem 1.1rem; display: flex; flex-direction: column; gap: 0.8rem; font-size: 0.97rem; }
.cardcal { padding: 1.1rem; background: var(--surface-2); border-radius: var(--r-sm); overflow-x: auto; }
.cardbox { border: 3px solid var(--primary); border-radius: 3.2mm; display: grid; place-items: center; color: var(--muted); font-weight: 700; background: var(--surface); }
.gammacv { image-rendering: pixelated; border-radius: 8px; }
.readout { font-variant-numeric: tabular-nums; color: var(--text); font-weight: 700; }
.wizard { max-width: 48rem; width: 100%; display: flex; flex-direction: column; gap: 1.2rem; }
.wizard .view-head { flex-direction: column; align-items: flex-start; gap: 0.3rem; }
.wizard .view-head > .vh { flex: none; }
.progressdots { display: flex; gap: 0.35rem; align-items: center; }
.progressdots i { height: 0.4rem; flex: 1; border-radius: 999px; background: var(--surface-3); }
.progressdots i.on { background: var(--primary); }
.wizard-nav { display: flex; justify-content: space-between; gap: 0.8rem; flex-wrap: wrap; }
.wiz-brand { padding: 0; }
.welcome-art { display: flex; gap: 1rem; align-items: center; }
.bullets { padding-left: 0; list-style: none; display: flex; flex-direction: column; gap: 0.75rem; }
.bullets li { display: flex; gap: 0.75rem; align-items: flex-start; }
.bullets li .ic { color: var(--primary-text); margin-top: 0.1rem; }

/* black test */
.glasses-row { display: grid; grid-template-columns: minmax(0, 1fr) 15rem; gap: 1.2rem; align-items: center; }
.lenschip .sw { width: 0.95rem; height: 0.95rem; border-radius: 50%; border: 1px solid rgba(0,0,0,0.3); flex: none; }
.lenspick legend b { color: var(--text); }
.specs { width: 100%; max-width: 15rem; height: auto; }
.specs-l { fill: var(--muted); font-size: 12px; font-family: var(--font); }
.specs-frame { stroke: var(--line-strong); }
.blacktest { display: flex; flex-direction: column; gap: 0.9rem; border-top: var(--border-w) solid var(--line); padding-top: 1rem; }
.blackcv { display: block; border-radius: var(--r-sm); background: #000; max-width: 100%; }
.binstr { max-width: 65ch; }
.quiz { background: var(--surface-2); border-radius: var(--r-sm); padding: 1rem 1.1rem; display: flex; flex-direction: column; gap: 0.7rem; }
.cgroups { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.8rem; }
.cgroup { border: var(--border-w) solid var(--line); border-radius: var(--r-sm); padding: 0.9rem; display: flex; flex-direction: column; gap: 0.5rem; background: var(--surface); }
.cgroup.active { border-color: var(--primary); box-shadow: 0 0 0 2px var(--primary) inset; }
.cg-head { display: flex; align-items: center; gap: 0.6rem; }
.cg-head > div { flex: 1; min-width: 0; }
.swatch { width: 1.6rem; height: 1.6rem; border-radius: 7px; border: 1px solid var(--line-strong); flex: none; }
.hex { font-size: 0.85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.chan { display: grid; grid-template-columns: 3.2rem 1fr 2.4rem; align-items: center; gap: 0.6rem; font-size: 0.9rem; color: var(--muted); }
.chan input { min-width: 0; width: 100%; }
.chan output { font-variant-numeric: tabular-nums; color: var(--text); text-align: right; font-weight: 700; }

/* ---------- charts ---------- */
.cgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(23rem, 1fr)); gap: 1rem; }
.chartcard .card-head h3, .chartcard .card-head h2 { font-size: 1.05rem; }
.chartcard .card-head .muted { display: block; margin-top: 0.15rem; }
.chartcard .card-head, .rchart .card-head { flex-wrap: nowrap; align-items: flex-start; }
.chartcard .card-head > div, .rchart .card-head > div { min-width: 0; flex: 1 1 auto; }
.chartcard .readout, .rchart .readout { white-space: nowrap; display: inline-flex; align-items: center; gap: 0.5rem; font-size: 1.05rem; }
.rchart .card-head > .muted { flex: 0 1 auto; text-align: right; }
.chart { width: 100%; height: auto; display: block; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .tick { fill: var(--muted); font-size: 13px; font-family: var(--font); }
.chart .note { fill: var(--muted); font-size: 13px; font-family: var(--font); }
.chart .area { fill: var(--primary-soft); opacity: 0.9; }
.chart .line { fill: none; stroke: var(--primary); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
.chart .pt { fill: var(--surface); stroke: var(--primary); stroke-width: 2; }
.chart .pt.last { fill: var(--primary); }
.chart .lastlabel { fill: var(--text); font-size: 14px; font-weight: 700; font-family: var(--font); }
.chart .bar { fill: var(--line-strong); opacity: 0.55; }
.chart .bar.today { fill: var(--primary); opacity: 1; }
.chart .bar.met { fill: var(--primary); opacity: 0.75; }
.chart .target { stroke: var(--sun); stroke-dasharray: 5 4; stroke-width: 2; }
.chart-empty { min-height: 7rem; display: grid; place-items: center; color: var(--muted); font-size: 0.95rem; border: 2px dashed var(--line); border-radius: var(--r-sm); text-align: center; padding: 1rem; }
.tablewrap { overflow-x: auto; }
table.log { width: 100%; border-collapse: collapse; font-size: 0.94rem; }
table.log th { text-align: left; color: var(--muted); font-size: 0.84rem; font-weight: 600; padding: 0.55rem 0.6rem; border-bottom: var(--border-w) solid var(--line-strong); white-space: nowrap; }
table.log td { padding: 0.6rem; border-bottom: var(--border-w) solid var(--line); vertical-align: top; }
table.log td.num, table.log th.num { text-align: right; font-variant-numeric: tabular-nums; }
table.log tbody tr:hover td { background: var(--surface-2); }
.symlist { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 0.4rem; font-size: 0.95rem; }
.symlist li { display: flex; gap: 0.9rem; } .symlist li span:first-child { color: var(--muted); min-width: 4.5rem; }
.disclosure { background: var(--surface); border: var(--border-w) solid var(--line); border-radius: var(--r); padding: 1rem 1.3rem; box-shadow: var(--shadow); }
.disclosure > summary { font-weight: 700; font-size: 1.02rem; list-style-position: outside; }
.disclosure[open] > summary { margin-bottom: 0.8rem; }
.trend { display: inline-flex; align-items: center; gap: 0.25rem; font-weight: 600; white-space: nowrap; }
.trend .ic { width: 1rem; height: 1rem; }
.trend.up { color: var(--good); } .trend.down { color: var(--warn); } .trend.flat { color: var(--muted); }
.trend.down .ic { transform: rotate(180deg); }
.legendline { display: flex; flex-wrap: wrap; gap: 0.3rem 1rem; font-size: 0.86rem; color: var(--muted); align-items: center; }

/* ---------- report for the eye-care professional ---------- */
.report { background: var(--surface); border: var(--border-w) solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 2.2rem 2.4rem; display: flex; flex-direction: column; gap: 1.6rem; max-width: 62rem; }
.rhead { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem 2rem; flex-wrap: wrap; padding-bottom: 1.1rem; border-bottom: 2px solid var(--text); }
.rhead .rtitle { display: flex; flex-direction: column; gap: 0.25rem; }
.rhead .rtitle .eyebrow { display: flex; align-items: center; gap: 0.5rem; }
.rhead h1 { font-size: 1.7rem; }
.rhead .rmeta { text-align: right; font-size: 0.88rem; color: var(--muted); display: flex; flex-direction: column; gap: 0.1rem; }
.rhead .rmeta b { color: var(--text); }
.pgrid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; border: var(--border-w) solid var(--line); border-radius: var(--r-sm); overflow: hidden; }
.pgrid > div { padding: 0.7rem 0.9rem; border-right: var(--border-w) solid var(--line); border-bottom: var(--border-w) solid var(--line); display: flex; flex-direction: column; gap: 0.1rem; min-width: 0; }
.pgrid > div:nth-child(4n) { border-right: 0; }
.pgrid > div:nth-last-child(-n+4) { border-bottom: 0; }
.pgrid span { font-size: 0.8rem; color: var(--muted); font-weight: 600; }
.pgrid b { font-size: 0.98rem; font-weight: 600; overflow-wrap: anywhere; }
.rsect { display: flex; flex-direction: column; gap: 0.8rem; }
.rsect > h2 { break-after: avoid; }
.rsect > h2 { font-size: 1.08rem; display: flex; align-items: baseline; gap: 0.6rem; padding-bottom: 0.4rem; border-bottom: var(--border-w) solid var(--line); }
.rsect > h2 .n { font-size: 0.82rem; color: var(--primary-text); font-weight: 700; font-variant-numeric: tabular-nums; }
.rsect > h2 .muted { margin-left: auto; font-size: 0.84rem; font-weight: 400; }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0.8rem; }
.kpi { border: var(--border-w) solid var(--line); border-radius: var(--r-sm); padding: 0.8rem 0.95rem; display: flex; flex-direction: column; gap: 0.15rem; }
.kpi span { font-size: 0.82rem; color: var(--muted); font-weight: 600; }
.kpi b { font-size: 1.45rem; font-variant-numeric: tabular-nums; line-height: 1.2; }
.kpi b small { font-size: 0.85rem; color: var(--muted); font-weight: 400; }
.kpi em { font-style: normal; font-size: 0.82rem; color: var(--muted); }
.rcharts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem; }
.rchart { border: var(--border-w) solid var(--line); border-radius: var(--r-sm); padding: 0.85rem 1rem; display: flex; flex-direction: column; gap: 0.4rem; break-inside: avoid; }
.rchart .card-head h3 { font-size: 0.98rem; }
.rnote { font-size: 0.84rem; color: var(--muted); line-height: 1.5; }
.rfoot { border-top: var(--border-w) solid var(--line); padding-top: 0.9rem; display: flex; flex-direction: column; gap: 0.35rem; }
.rangepick .seg span { min-height: 2.5rem; font-size: 0.9rem; }
.flag { display: inline-flex; align-items: center; gap: 0.3rem; font-weight: 600; font-size: 0.86rem; padding: 0.1rem 0.5rem; border-radius: 6px; }
.flag.crit { background: var(--crit-soft); color: var(--crit); } .flag.good { background: var(--good-soft); color: var(--good); } .flag.warn { background: var(--warn-soft); color: var(--warn); }

/* ---------- accounts & roles ---------- */
body.gate-mode .app { grid-template-columns: 1fr; }
body.gate-mode .rail { display: none; }
body.gate-mode .main { margin: 0 auto; max-width: 60rem; }
.gate { display: flex; flex-direction: column; gap: 1.3rem; width: 100%; }
.gate-brand { padding: 0; }
.gate-cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem; align-items: start; }
.whogroup { display: flex; flex-direction: column; gap: 0.6rem; }
.whogroup h2 { font-size: 0.95rem; color: var(--muted); font-weight: 600; }
.whogrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr)); gap: 0.7rem; }
.whotile { display: flex; align-items: center; gap: 0.85rem; text-align: left; font: inherit; color: var(--text); background: var(--surface); border: var(--border-w) solid var(--line); border-radius: var(--r); padding: 0.9rem 1rem; min-height: 4.4rem; cursor: pointer; box-shadow: var(--shadow); transition: border-color .12s, background .12s; }
.whotile:hover { border-color: var(--primary); background: var(--primary-soft); }
.whotile > span:last-child { display: flex; flex-direction: column; min-width: 0; }
.whotile b { font-size: 1.02rem; }
.whotile span span { font-size: 0.85rem; color: var(--muted); }
.av { width: 2.6rem; height: 2.6rem; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 0.9rem; flex: none; background: var(--primary-soft); color: var(--primary-text); }
.av.doctor { background: var(--primary); color: var(--primary-ink); }
.av.admin { background: var(--sun-soft); color: var(--sun-ink); }
.av.big { width: 4rem; height: 4rem; font-size: 1.3rem; }
.patient .av { width: 2.1rem; height: 2.1rem; font-size: 0.8rem; }
.switchbtn { width: 100%; margin-top: 0.15rem; }
.rail-switch { display: none; }
.rail-switch .av { width: 1.8rem; height: 1.8rem; font-size: 0.72rem; }
.rolebadge { font-size: 0.78rem; font-weight: 600; padding: 0.1rem 0.5rem; border-radius: 6px; background: var(--surface-2); color: var(--muted); }
.pinpanel { align-self: center; width: 100%; max-width: 24rem; align-items: center; text-align: center; gap: 0.6rem; padding: 1.6rem 1.5rem 1.3rem; position: relative; }
.pinpanel h1 { font-size: 1.5rem; }
.pinback { align-self: flex-start; margin: -0.6rem 0 0 -0.6rem; }
.pindots { display: flex; gap: 0.8rem; justify-content: center; margin: 0.4rem 0 0; }
.pindots i { width: 1rem; height: 1rem; border-radius: 50%; border: 2px solid var(--line-strong); }
.pindots i.on { background: var(--primary); border-color: var(--primary); }
.pinmsg { min-height: 1.5em; font-size: 0.92rem; }
.pinpad { display: grid; grid-template-columns: repeat(3, 4.6rem); gap: 0.6rem; justify-content: center; }
.pinkey { font: inherit; font-size: 1.5rem; font-weight: 600; height: 4.1rem; border-radius: var(--r); border: var(--border-w) solid var(--line-strong); background: var(--surface); color: var(--text); cursor: pointer; display: grid; place-items: center; font-variant-numeric: tabular-nums; }
.pinkey:hover { background: var(--surface-2); }
.pinkey:active { background: var(--primary-soft); }
.pinkey.fn { font-size: 0.9rem; color: var(--muted); }
.pinkey:disabled { opacity: 0.4; cursor: not-allowed; }
.demohint summary { font-size: 0.95rem; }
code { font-family: ui-monospace, "Atkinson Hyperlegible Mono", Menlo, Consolas, monospace; font-size: 0.92em; background: var(--surface-2); padding: 0.05rem 0.35rem; border-radius: 5px; }
.formcard { border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary) inset, var(--shadow); }
textarea { font: inherit; color: var(--text); background: var(--surface); border: var(--border-w) solid var(--line-strong); border-radius: var(--r-sm); padding: 0.7rem 0.8rem; width: 100%; resize: vertical; line-height: 1.5; }
textarea:hover { border-color: var(--text); }
.cellwho { display: inline-flex; align-items: center; gap: 0.65rem; }
.cellwho > span:not(.av) { display: flex; flex-direction: column; line-height: 1.3; }
.cellwho .av { width: 2.1rem; height: 2.1rem; font-size: 0.78rem; }
table.log td select { min-height: 2.4rem; font-size: 0.92rem; }
.nowrap { white-space: nowrap; }
.patlist tbody tr { cursor: pointer; }
.patlist tbody tr:focus-visible { outline: 3px solid var(--focus); outline-offset: -3px; }
.adh { display: inline-block; vertical-align: middle; width: 4.5rem; height: 0.5rem; border-radius: 999px; background: var(--surface-3); overflow: hidden; }
.adh i { display: block; height: 100%; background: var(--primary); border-radius: 999px; }
.flag.info { background: var(--primary-soft); color: var(--primary-text); }
.flag .ic { width: 0.95rem; height: 0.95rem; }
.backlink { display: inline-flex; align-items: center; gap: 0.35rem; text-decoration: none; font-weight: 600; font-size: 0.92rem; width: fit-content; margin-bottom: -0.6rem; }
.backlink .ic { width: 1.05rem; height: 1.05rem; }
.pathead { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
.pathead .vh { flex: 1 1 18rem; display: flex; flex-direction: column; gap: 0.25rem; }
.tabs { display: flex; gap: 0.2rem; border-bottom: var(--border-w) solid var(--line); overflow-x: auto; margin-bottom: -0.3rem; }
.tabs a { display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.7rem 0.95rem; text-decoration: none; color: var(--muted); font-weight: 600; font-size: 0.95rem; border-bottom: 3px solid transparent; margin-bottom: -1px; white-space: nowrap; min-height: 2.9rem; }
.tabs a:hover { color: var(--text); }
.tabs a.on { color: var(--primary-text); border-bottom-color: var(--primary); }
.count-badge { font-size: 0.75rem; min-width: 1.3rem; padding: 0 0.35rem; height: 1.3rem; border-radius: 999px; display: inline-grid; place-items: center; background: var(--crit); color: #fff; font-weight: 700; }
.count-badge.muted { background: var(--surface-3); color: var(--muted); }
#tabbody { display: flex; flex-direction: column; gap: 1.1rem; }
.flaglist { display: flex; flex-direction: column; gap: 0.6rem; }
.notelist { list-style: none; padding: 0; display: flex; flex-direction: column; }
.notelist li { padding: 0.8rem 0; border-bottom: var(--border-w) solid var(--line); display: flex; flex-direction: column; gap: 0.3rem; }
.notelist li:last-child { border-bottom: 0; }
.notelist p { white-space: pre-wrap; }
.savebar { position: sticky; bottom: 0; background: var(--bg); padding: 0.8rem 0; border-top: var(--border-w) solid var(--line); z-index: 5; }
.docmsg p { margin-top: 0.3rem; }
.filters { gap: 1rem 1.4rem; }
.filters .field { font-size: 0.9rem; }
tr.rowwarn td { background: var(--warn-soft); }
.perm { display: inline-flex; align-items: center; gap: 0.35rem; font-size: 0.88rem; }
.perm .ic { width: 1.05rem; height: 1.05rem; }
.perm.yes { color: var(--good); }
.perm.some { color: var(--primary-text); }
.perm.some span { color: var(--text); }
.perm.no { color: var(--muted); }
table.matrix td:not(:first-child), table.matrix th:not(:first-child) { width: 15%; }
.demo-pins code { font-size: 1rem; }
@media (max-width: 860px) {
  .gate-cols { grid-template-columns: 1fr; }
  .rail .patient { display: none; }
  .rail-switch { display: inline-flex; margin-left: auto; padding: 0 0.5rem 0 0.3rem; gap: 0.35rem; }
}

/* ---------- training stage (always dark around the stimuli) ---------- */
.stage { position: fixed; inset: 0; z-index: 100; background: #000; }
.stage-gl { position: absolute; inset: 0; display: block; touch-action: none; }
.stage-top { position: absolute; top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 1rem; padding: 0.7rem 1rem; background: linear-gradient(180deg, rgba(0,0,0,0.85), rgba(0,0,0,0)); pointer-events: none; color: #e6edf1; }
.stage-top > * { pointer-events: auto; }
.stage-title { font-weight: 700; display: flex; align-items: center; gap: 0.5rem; font-size: 1rem; text-shadow: 0 1px 3px #000; }
.eye-dot { width: 0.75rem; height: 0.75rem; border-radius: 50%; background: #9aa; }
.eye-dot.both { background: linear-gradient(90deg, var(--eyeL) 50%, var(--eyeR) 50%); }
.stage-stats { display: flex; align-items: center; gap: 1rem; font-size: 0.95rem; color: #d3dde3; flex: 1; text-shadow: 0 1px 3px #000; flex-wrap: wrap; }
.timebar { width: 9rem; height: 0.4rem; border-radius: 999px; background: rgba(255,255,255,0.18); overflow: hidden; }
.timebar i { display: block; height: 100%; width: 0; background: #63c3cf; border-radius: 999px; }
body[data-ui="contrast"] .timebar i { background: #ffd400; }
.stage-stats [data-k=time] { font-variant-numeric: tabular-nums; font-weight: 700; color: #fff; min-width: 4.6rem; }
.stage-actions { display: flex; gap: 0.5rem; }

/* ---------- a game's own settings page (always the dark palette) ---------- */
.stage-setup { position: absolute; inset: 0; overflow-y: auto; background: #0d1419; color: #e6edf1; z-index: 3; }
.ejs { --line: #2a3842; --line-hi: #4a5d6a; --card: #141d24; --card-on: #12323b; --on: #e6edf1; --muted: #a6b5bf; --acc: #63c3cf; --acc-ink: #04181d;
  max-width: 35rem; margin: 0 auto; padding: 1rem 1.1rem 0; display: flex; flex-direction: column; gap: 1.05rem; font-family: var(--font); }
.ejs h1 { font-size: 1.6rem; text-align: center; color: var(--on); letter-spacing: -0.02em; }

.ejs-helpbox { background: var(--card); border: 1px solid var(--line); border-left: 3px solid var(--acc); border-radius: var(--r-sm); padding: 0.9rem 1rem; display: flex; flex-direction: column; gap: 0.5rem; font-size: 0.95rem; color: #cfd9df; line-height: 1.55; }
.ejs-helpbox[hidden] { display: none; }

.ejs-note b { color: var(--on); }
.ejs .sw { display: inline-block; width: 0.8rem; height: 0.8rem; border-radius: 50%; vertical-align: -1px; margin-right: 0.2rem; }
.ejs-link { background: none; border: 0; color: var(--acc); font: inherit; font-weight: 600; cursor: pointer; padding: 0.2rem; text-decoration: underline; text-underline-offset: 3px; }
.ejs-preview { background: #000; border: 1px solid var(--line); border-radius: 12px; min-height: 9rem; display: flex; align-items: center; justify-content: center; gap: 2.2rem; padding: 1rem; position: relative; overflow: hidden; }

.ejs-preview .cap { position: absolute; left: 0.8rem; top: 0.55rem; font-size: 0.76rem; color: #7d8d97; letter-spacing: 0.04em; text-transform: uppercase; font-weight: 600; }
.ejs-sect { display: flex; flex-direction: column; gap: 0.5rem; }

.ejs-chips { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 0.45rem; }
.ejs-chip { min-height: 2.85rem; border: 1.5px solid var(--line-hi); background: var(--card); border-radius: var(--r-sm); cursor: pointer; font: inherit; font-size: 0.98rem; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 0.4rem; color: #c3cfd6; transition: border-color .12s, background .12s; }
.ejs-chip .ic { width: 1.2rem; height: 1.2rem; }
.ejs-chip small { font-size: 0.78rem; }
.ejs-chip[aria-pressed="true"] { border-color: var(--acc); color: var(--on); background: var(--card-on); box-shadow: inset 0 0 0 1px var(--acc); font-weight: 600; }
.ejs-chip:hover { border-color: #7d8d97; }
.ejs-chip[aria-pressed="true"]:hover { border-color: var(--acc); }
.ejs .g { font-family: Calibri, Carlito, "Segoe UI", Arial, sans-serif; font-weight: 400; }
.ejs-chip .g { font-size: 1.25rem; color: var(--on); }
.ejs-slider { display: grid; grid-template-columns: auto 1fr auto; gap: 0.7rem; align-items: center; }
.ejs-slider .end { color: #7d8d97; display: grid; place-items: center; width: 2rem; }
.ejs-slider .end.txt { width: 3.4rem; font-size: 0.76rem; text-align: center; line-height: 1.2; }
.ejs-sect[hidden] { display: none; }
.ejs-preview.cf { display: grid; place-items: center; }
.ejs-preview.em { display: block; padding: 0; }
.ejs-preview.em canvas { display: block; }
.ejs-preview.cf .cap { color: rgba(255,255,255,0.75); text-shadow: 0 1px 2px rgba(0,0,0,0.5); }
.ejs-preview.cf.light .cap { color: rgba(0,0,0,0.6); text-shadow: none; }
.ejs-chip svg { width: 1.5rem; height: 1.5rem; flex: none; }
.ejs-slider input[type=range] { width: 100%; min-width: 0; accent-color: var(--acc); height: 2.2rem; }
.ejs-paths { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.5rem; }
.ejs-ptile { background: none; border: 0; padding: 0; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 0.3rem; color: var(--muted); font: inherit; }
.ejs-ptile .box { width: 100%; height: 3.1rem; border: 1.5px solid var(--line-hi); border-radius: var(--r-sm); display: grid; place-items: center; background: var(--card); color: #8b9aa4; transition: border-color .12s; }
.ejs-ptile .box svg { width: 68%; height: 68%; overflow: visible; }
.ejs-ptile > span:last-child { font-size: 0.8rem; text-align: center; line-height: 1.15; }
.ejs-ptile[aria-pressed="true"] { color: var(--on); font-weight: 600; }
.ejs-ptile[aria-pressed="true"] .box { border-color: var(--acc); color: #fff; background: var(--card-on); box-shadow: inset 0 0 0 1px var(--acc); }

.ejs-dur button::before { content: ""; position: absolute; top: calc(0.2rem + 0.5rem - 1px); left: 0; right: 0; height: 2px; background: var(--line-hi); }
.ejs-dur button:first-child::before { left: 50%; } .ejs-dur button:last-child::before { right: 50%; }
.ejs-dur .dot { width: 1rem; height: 1rem; border-radius: 50%; background: #3b4b56; border: 2px solid #0d1419; position: relative; box-sizing: content-box; margin-top: -2px; }
.ejs-dur button:hover .dot { background: #7d8d97; }
.ejs-dur button[aria-pressed="true"] { color: var(--on); font-weight: 700; }
.ejs-dur button[aria-pressed="true"] .dot { background: var(--acc); box-shadow: 0 0 0 3px rgba(99,195,207,0.25); }
.ejs-startbar { position: sticky; bottom: 0; padding: 0.9rem 0 1rem; background: linear-gradient(180deg, rgba(13,20,25,0), #0d1419 30%); display: flex; flex-direction: column; align-items: center; gap: 0.45rem; }
.ejs-start { width: 100%; min-height: 3.35rem; border: 0; border-radius: 12px; background: var(--acc); color: var(--acc-ink); font: inherit; font-weight: 700; font-size: 1.12rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 0.5rem; }
.ejs-start:hover { background: #86d2dc; }
.ejs-hint { font-size: 0.84rem; color: #8b9aa4; text-align: center; }
body[data-ui="contrast"] .ejs { --acc: #ffd400; --line: #8a8a8a; --line-hi: #bdbdbd; --card-on: #2e2600; }
.kvs { display: flex; flex-direction: column; }
.kv { display: flex; justify-content: space-between; gap: 1rem; padding: 0.6rem 0; border-bottom: var(--border-w) solid var(--line); font-size: 0.97rem; }
.kv span { color: var(--muted); } .kv b { text-align: right; font-variant-numeric: tabular-nums; }
.celebrate { display: flex; gap: 0.8rem; align-items: center; background: var(--sun-soft); color: var(--sun-ink); padding: 0.8rem 1rem; border-radius: var(--r-sm); font-weight: 700; }
.celebrate .ic { width: 1.5rem; height: 1.5rem; }
.feel { display: flex; flex-wrap: wrap; gap: 0.6rem; }
.sym { display: flex; flex-wrap: wrap; gap: 0.6rem; }
.symbtn { font: inherit; font-weight: 600; min-height: 2.75rem; padding: 0 1rem; border-radius: var(--r-btn); border: var(--border-w) solid var(--line-strong); background: var(--surface); color: var(--text); cursor: pointer; }
.symbtn:hover { background: var(--surface-2); }
.symbtn[aria-pressed="true"] { background: var(--crit-soft); border-color: var(--crit); color: var(--crit); }
.symbtn.askbtn[aria-pressed="true"] { background: var(--primary-soft); border-color: var(--primary); color: var(--primary-text); }
.fovmap { display: flex; justify-content: center; align-items: center; gap: 1.2rem; }
.fovmap svg { width: 7.5rem; height: 7.5rem; flex: none; }
.fovlegend { display: flex; flex-direction: column; gap: 0.3rem; font-size: 0.84rem; color: var(--muted); }
.fovlegend b { color: var(--text); font-size: 0.88rem; }
.fovlegend i { display: inline-block; width: 0.8rem; height: 0.8rem; border-radius: 3px; vertical-align: -1px; margin-right: 0.25rem; }
.nextup { display: flex; gap: 0.9rem; align-items: center; padding: 0.9rem 1rem; border-radius: var(--r-sm); background: var(--surface-2); }
.nextup .gicon { flex: none; }
.change { display: flex; flex-direction: column; gap: 0.4rem; }
.change li { display: flex; gap: 0.6rem; align-items: center; }
.change li .ic { color: var(--primary-text); }

/* ---------- responsive ---------- */
@media (max-width: 1080px) {
  .settings-layout { grid-template-columns: 1fr; }
  .toc { display: none; }
  .tiles.four, .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; }
  .rail { position: sticky; top: 0; z-index: 20; height: auto; flex-direction: row; align-items: center; padding: 0.6rem 1rem; gap: 0.8rem; border-right: 0; border-bottom: var(--border-w) solid var(--line); overflow: visible; }
  .navlab { display: none; }
  .rail nav { position: fixed; bottom: 0; left: 0; right: 0; flex-direction: row; justify-content: space-around; background: var(--surface); border-top: var(--border-w) solid var(--line); padding: 0.3rem 0.3rem calc(0.3rem + env(safe-area-inset-bottom)); z-index: 30; }
  .rail nav a { flex-direction: column; gap: 0.15rem; min-height: 3.4rem; padding: 0.3rem 0.2rem; font-size: 0.72rem; flex: 1; justify-content: center; text-align: center; }
  .rail nav a.on::before { left: 25%; right: 25%; top: -0.3rem; bottom: auto; width: auto; height: 3px; border-radius: 0 0 3px 3px; }
  .rail-foot { display: none; }
  .main { padding-bottom: 6.5rem; padding-top: 1.4rem; }
  .tiles, .tiles.two { grid-template-columns: 1fr; }
  .hero { grid-template-columns: 1fr; justify-items: start; padding: 1.4rem; gap: 1.1rem; }
  .ring { width: 6.2rem; height: 6.2rem; }
  .ring .center b { font-size: 1.45rem; }
  .ring .center span { font-size: 0.72rem; }
  .grid2, .glasses-row, .cgroups { grid-template-columns: 1fr; }
  .cgrid, .rcharts { grid-template-columns: 1fr; }
  .plan li { grid-template-columns: 2.6rem 1fr auto; }
  .plan li .state-pill { display: none; }
  .stage-stats .timebar { display: none; }
  .report { padding: 1.3rem 1.1rem; }
  .pgrid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .pgrid > div:nth-child(4n) { border-right: var(--border-w) solid var(--line); }
  .pgrid > div:nth-child(2n) { border-right: 0; }
  .pgrid > div:nth-last-child(-n+4) { border-bottom: var(--border-w) solid var(--line); }
  .pgrid > div:nth-last-child(-n+2) { border-bottom: 0; }
  .rhead .rmeta { text-align: left; }
}
@media (max-width: 520px) {
  .tiles.four, .kpis { grid-template-columns: 1fr 1fr; }
  .kpi b { font-size: 1.25rem; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; scroll-behavior: auto !important; } }

/* ---------- print: the report on clean A4 pages ---------- */
@page { size: A4; margin: 14mm 13mm; }
@media print {
  body, body[data-ui] { --bg: #fff; --surface: #fff; --surface-2: #f2f4f6; --surface-3: #e5e9ec; --line: #c9d1d7; --line-strong: #6b7b86; --text: #000; --muted: #333f48; --primary: #0b5a6b; --primary-soft: #e6f0f2; --primary-text: #0b5a6b; --good: #1c6840; --good-soft: #e3f1e8; --warn: #7f4600; --warn-soft: #fbefd9; --crit: #a3241c; --crit-soft: #fbe8e6; --shadow: none; --border-w: 1px; background: #fff; color: #000; font-size: 10.5pt; }
  html { font-size: 13px !important; }
  .rail, .skip, .noprint, .head-actions, .rangepick { display: none !important; }
  .app { display: block; }
  .main { padding: 0; max-width: none; gap: 0.8rem; }
  .report { border: 0; box-shadow: none; padding: 0; max-width: none; gap: 1.1rem; }
  .rchart, .kpi, .kpis, .pgrid, .rhead, table.log tr, .rfoot { break-inside: avoid; }
  .rsect > h2 { break-after: avoid; }
  .rcharts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kpis { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .pgrid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  a { color: #000; text-decoration: none; }
  table.log tbody tr:hover td { background: none; }
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}

/* ---------- game-specific extras ---------- */
/* OKN Stripes */

.stage.pills .stage-tip:not(:empty) { left: 50%; right: auto; transform: translateX(-50%); }
.stage.pills .stage-back { background: rgba(0,0,0,0.72); padding: 0.35rem 0.6rem; border-radius: 12px; }

/* Peripheral Chart: EYEBAB-style tiles */
.ejs-paths.pc.t3 { grid-template-columns: repeat(3, 1fr); gap: 0.7rem; }
.ejs-paths.pc.t2 { grid-template-columns: repeat(2, 1fr); gap: 0.7rem; width: 68%; margin: 0 auto; }
.ejs-paths.pc .ejs-ptile .box { height: 4.2rem; }
.ejs-paths.pc .ejs-ptile .box svg { width: 3rem; height: 3rem; }
.ejs-paths.pc .ejs-ptile .box svg.wide { width: 4.4rem; height: 2.2rem; }
.ejs-paths.pc .ejs-ptile > span:last-child { font-size: 0.9rem; }
.ejs-paths.pc .ejs-ptile .box .txt { font-family: Calibri, Carlito, "Segoe UI", Arial, sans-serif; font-size: 1.75rem; letter-spacing: 0.3em; margin-right: -0.3em; line-height: 1; }
.ejs-ptile[aria-pressed="true"]:hover .box { border-color: var(--acc); }
.stage-colour { position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }

/* Split Vision: EYEBAB-style tiles */
.ejs-paths.pc.t5 { grid-template-columns: repeat(5, 1fr); gap: 0.5rem; }
.ejs-paths.pc.t4 { grid-template-columns: repeat(4, 1fr); gap: 0.6rem; }
